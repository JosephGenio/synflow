version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: synflow-mssql
    ports:
      - "1433:1433"
    env_file:
      - env/.env.development
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - synflow-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${DB_PASSWORD}" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    container_name: synflow-backend
    ports:
      - "3001:3001"
    env_file:
      - env/.env.development
    environment:
      NODE_ENV: development
      DB_HOST: mssql
    volumes:
      - ./packages/server/src:/app/packages/server/src:ro
      - ./packages/server/package.json:/app/packages/server/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./packages/server/tsconfig.json:/app/packages/server/tsconfig.json:ro
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - synflow-network
    command: pnpm --filter @synflow/server dev

volumes:
  mssql-data:

networks:
  synflow-network:
    driver: bridge
