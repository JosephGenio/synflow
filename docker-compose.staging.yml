services:
  postgres:
    image: postgres:16-alpine
    container_name: synflow-postgres-staging
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-synflow}
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    networks:
      - synflow-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-synflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    container_name: synflow-backend-staging
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      APP_URL: ${APP_URL}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synflow-staging-network
    restart: unless-stopped

volumes:
  postgres-staging-data:

networks:
  synflow-staging-network:
    driver: bridge
