services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: synflow-mssql-staging
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mssql-staging-data:/var/opt/mssql
    networks:
      - synflow-staging-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${DB_PASSWORD}" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    container_name: synflow-backend-staging
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DB_HOST: mssql
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - synflow-staging-network
    restart: unless-stopped

volumes:
  mssql-staging-data:

networks:
  synflow-staging-network:
    driver: bridge
